<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xupeimon · Multi-View</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="theme-color" content="#0b0912">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --g:#1ee836; --g2:#12b526; --p:#f73992; --p2:#c71f6d;
    --bg:#0b0912; --panel:#141120; --panel2:#1d192d; --line:#2e2846; --txt:#f3f0fb; --mut:#9d96b8;
    --acc:var(--g); --acc-d:var(--g2);
    --tw:#9146ff; --kk:#53fc18; --live:var(--p);
    --hh:74px; --pad:14px; --side:310px; --chat:340px;
    --px-shadow:0 4px 0 #000;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--txt); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    background:
      radial-gradient(900px 600px at -10% -20%, rgba(30,232,54,.20), transparent 60%),
      radial-gradient(900px 600px at 110% 120%, rgba(247,57,146,.22), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 24px),
      var(--bg);
  }
  .px { font-family:"Silkscreen", ui-monospace, monospace; letter-spacing:.5px; }
  button, select, input { font:inherit; color:var(--txt); }
  button { cursor:pointer; }
  ::selection { background:var(--p); color:#fff; }

  /* ---------- header ---------- */
  header { position:relative; height:var(--hh); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:0 18px; background:rgba(11,9,18,.75); backdrop-filter:blur(6px); }
  header::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg, var(--g), var(--p)); }
  .logo { display:flex; align-items:center; text-decoration:none; }
  .logo img { height:58px; display:block; filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)); transition:transform .2s; }
  .logo:hover img { transform:rotate(-2deg) scale(1.04); }
  h1 { margin:0; font-size:30px; text-align:center; white-space:nowrap; color:#fff; text-shadow:3px 3px 0 var(--p), -3px -3px 0 var(--g); letter-spacing:2px; }
  .hright { display:flex; justify-content:flex-end; align-items:center; gap:10px; }
  .count { color:var(--mut); font-size:12px; white-space:nowrap; }
  .btn { background:var(--panel2); border:2px solid var(--line); border-radius:10px; padding:6px 11px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 3px 0 #000; transition:transform .1s, border-color .15s, box-shadow .1s; }
  .btn:hover { border-color:var(--p); transform:translateY(-1px); box-shadow:0 4px 0 #000; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 #000; }
  .btn.on { background:var(--g); color:#06210b; border-color:var(--g); }
  .btn.pink { background:var(--p); color:#fff; border-color:var(--p); }
  .btn.pink.on { background:var(--p); color:#fff; border-color:#fff; }

  /* ---------- layout ---------- */
  #app { height:calc(100% - var(--hh)); display:flex; gap:var(--pad); padding:var(--pad); }
  .panel { background:linear-gradient(180deg, rgba(29,25,45,.92), rgba(20,17,32,.95)); border:2px solid var(--g); border-radius:14px; box-shadow:var(--px-shadow), 0 0 30px rgba(30,232,54,.08); }

  /* sidebar */
  #side { width:var(--side); flex:none; display:flex; flex-direction:column; padding:14px; gap:10px; min-height:0; transition:width .2s; }
  #side.collapsed { width:56px; padding:10px 8px; }
  #side.collapsed > :not(.shead) , #side.collapsed .shead > :not(#collapse) { display:none; }
  .shead { display:flex; align-items:center; gap:6px; }
  .shead h2 { margin:0; font-size:15px; flex:1; color:var(--g); text-shadow:2px 2px 0 #000; }
  .ico { width:32px; height:32px; padding:0; border-radius:9px; background:var(--panel2); border:2px solid var(--line); display:grid; place-items:center; font-size:14px; box-shadow:0 3px 0 #000; }
  .ico:hover { border-color:var(--p); }
  .ico.on { border-color:var(--g); color:var(--g); }
  .search { display:flex; align-items:center; gap:8px; border:2px solid var(--line); border-radius:10px; padding:0 10px; background:#0d0b16; transition:border-color .15s; }
  .search:focus-within { border-color:var(--p); }
  .search input { flex:1; background:none; border:0; outline:0; padding:9px 0; }
  .checks { display:flex; flex-direction:column; gap:4px; font-size:13px; }
  .checks label { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .checks input { accent-color:var(--p); width:15px; height:15px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #addForm { display:none; flex-direction:column; gap:8px; padding:10px; border:2px dashed var(--p); border-radius:12px; background:rgba(247,57,146,.06); }
  #addForm.open { display:flex; }
  #addForm .plats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  #addForm input { background:#0d0b16; border:2px solid var(--line); border-radius:10px; padding:8px 10px; outline:0; }
  #addForm input:focus { border-color:var(--g); }
  .plat.on.twitch { background:var(--tw); border-color:var(--tw); color:#fff; }
  .plat.on.kick { background:var(--kk); border-color:var(--kk); color:#04140a; }
  .plat.on.youtube { background:#ff0033; border-color:#ff0033; color:#fff; }

  #list { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; padding:2px 4px 6px 2px; }
  #list.lines { grid-template-columns:1fr; gap:6px; }
  #list::-webkit-scrollbar, .chatbody::-webkit-scrollbar, .tabs::-webkit-scrollbar { width:8px; height:6px; }
  #list::-webkit-scrollbar-thumb, .tabs::-webkit-scrollbar-thumb { background:linear-gradient(var(--g), var(--p)); border-radius:4px; }

  /* cards */
  .card { position:relative; background:var(--panel2); border:2px solid #000; border-radius:12px; padding:5px; cursor:pointer; user-select:none; box-shadow:0 4px 0 #000; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 7px 0 #000; border-color:var(--p); }
  .card.sel { border-color:var(--g); box-shadow:0 4px 0 #000, 0 0 0 2px var(--g), 0 0 18px rgba(30,232,54,.45); }
  .card .av { width:100%; aspect-ratio:1; border-radius:9px; background:#0d0b16 center/cover no-repeat; display:grid; place-items:center; font-size:34px; font-weight:700; color:var(--g); overflow:hidden; position:relative; }
  /* fundos chamativos (um por pessoa) */
  .card .av.skin::before { content:""; position:absolute; inset:0; background:repeating-conic-gradient(rgba(255,255,255,.12) 0 25%, transparent 0 50%) 0 0 / 18px 18px; }
  .card .av.skin::after { content:""; position:absolute; left:15%; right:15%; bottom:7%; height:10%; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.45), transparent); }
  .av.bg0 { background:radial-gradient(circle at 50% 30%, #9dffa8 0%, #1ee836 45%, #0b8f1f 100%); }
  .av.bg1 { background:radial-gradient(circle at 50% 30%, #ffb3d4 0%, #f73992 45%, #a0124f 100%); }
  .av.bg2 { background:linear-gradient(145deg, #1ee836 0%, #18c9a0 45%, #f73992 100%); }
  .av.bg3 { background:linear-gradient(145deg, #f73992 0%, #b14bff 55%, #1ee836 120%); }
  .card .av.skin img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:1; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35)); transition:transform .2s, opacity .3s; }
  .card .av.skin img:not([src]) { opacity:0; }
  .card:hover .av.skin img { transform:scale(1.07); }
  .card .av .face { position:relative; z-index:1; width:42%; aspect-ratio:1; image-rendering:pixelated; border-radius:4px; box-shadow:0 4px 0 rgba(0,0,0,.4); transition:opacity .3s; }
  .card .av.done .face { opacity:0; }
  .card.live { border-color:var(--p); animation:pulse 1.8s ease-in-out infinite; }
  .card.live.sel { border-color:var(--g); }
  @keyframes pulse { 0%,100% { box-shadow:0 4px 0 #000, 0 0 0 0 rgba(247,57,146,0); } 50% { box-shadow:0 4px 0 #000, 0 0 22px 5px rgba(247,57,146,.75); } }
  .card .info { padding:6px 4px 2px; }
  .card .nm { font-weight:800; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .st { font-size:11px; color:var(--mut); display:flex; align-items:center; gap:5px; }
  .card.live .st { color:#ffc2dd; font-weight:700; }
  .card .tick { position:absolute; top:10px; right:10px; z-index:2; width:20px; height:20px; border-radius:6px; border:2px solid #000; background:rgba(255,255,255,.85); display:grid; place-items:center; font-size:12px; font-weight:900; color:#06210b; box-shadow:0 2px 0 #000; }
  .card.sel .tick { background:var(--g); }
  .card .rm { position:absolute; top:10px; left:10px; z-index:3; width:22px; height:22px; border-radius:6px; border:2px solid #000; background:#fff; color:#000; font-size:11px; font-weight:900; display:none; padding:0; }
  .card:hover .rm { display:block; }
  .card .rm:hover { background:var(--p); color:#fff; }
  .card .tg { position:absolute; top:10px; left:10px; z-index:2; display:flex; gap:3px; transition:opacity .15s; }
  .card .tg .tag { border:2px solid #000; }
  .card:hover .tg { opacity:0; }
  #list.lines .card { display:grid; grid-template-columns:42px 1fr auto; align-items:center; gap:10px; padding:4px 8px 4px 4px; }
  #list.lines .card:hover { transform:none; }
  #list.lines .card .av { width:42px; font-size:16px; }
  #list.lines .card .info { padding:0; min-width:0; }
  #list.lines .card .tick { position:static; }
  #list.lines .card .tg { display:none; }
  #list.lines .card .av.skin img, #list.lines .card .av.skin::after { display:none; }
  #list.lines .card .av .face { width:68%; opacity:1 !important; }
  #list.lines .card .rm { top:50%; left:auto; right:40px; transform:translateY(-50%); }
  /* separadores e destaque de quem tá ao vivo */
  .sep { grid-column:1 / -1; display:flex; align-items:center; gap:8px; margin:4px 2px 0; font-size:12px; color:var(--mut); }
  .sep::after { content:""; flex:1; height:2px; background:var(--line); border-radius:2px; }
  .sep.live { color:var(--p); text-shadow:2px 2px 0 #000; }
  .sep.live::after { background:linear-gradient(90deg, var(--p), transparent); }
  .sep b { background:var(--p); color:#fff; border:2px solid #000; border-radius:6px; padding:0 6px; font-size:11px; box-shadow:0 2px 0 #000; text-shadow:none; }
  .sep:first-child { margin-top:0; }
  .card .onair { position:absolute; left:50%; transform:translateX(-50%); z-index:2; bottom:52px; background:var(--p); color:#fff; border:2px solid #000; border-radius:7px; padding:1px 7px; font-size:10px; white-space:nowrap; box-shadow:0 3px 0 #000; animation:onair 1.4s ease-in-out infinite; }
  @keyframes onair { 50% { background:#ff5fa8; transform:translateX(-50%) scale(1.06); } }
  .card.live { border:3px solid var(--p); }
  .card.live .nm { color:#ff7ab6; }
  .card.off .av { filter:grayscale(.85) brightness(.7); transition:filter .2s; }
  .card.off .nm { color:#c9c3dc; }
  .card.off:hover .av, .card.off.sel .av { filter:none; }
  #list.lines .card .onair { display:none; }
  #list.lines .card.live .av { box-shadow:0 0 0 3px var(--p); }
  .tile.is-live .lbl { background:var(--p); color:#fff; }
  .tile.is-live .lbl .dot.live { background:#fff; box-shadow:0 0 8px #fff; }
  .none { grid-column:1 / -1; text-align:center; color:var(--mut); font-size:12px; padding:18px 0; }

  .dot { width:8px; height:8px; border-radius:2px; background:#5a5470; flex:none; display:inline-block; }
  .dot.live { background:var(--p); box-shadow:0 0 8px var(--p); animation:blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  .tag { font-size:10px; font-weight:800; padding:1px 5px; border-radius:5px; color:#fff; }
  .tag.twitch { background:var(--tw); }
  .tag.kick { background:var(--kk); color:#04140a; }
  .tag.youtube { background:#ff0033; }
  .tile .ctl .pb { width:auto; padding:0 8px; font-size:11px; font-weight:800; }

  /* scene */
  #scene { flex:1; min-width:0; position:relative; border-radius:14px; }
  #scene.empty { border:3px dashed var(--p); display:grid; place-items:center; text-align:center; background:rgba(247,57,146,.04); }
  .emptymsg img { width:96px; image-rendering:pixelated; border-radius:14px; border:3px solid #000; box-shadow:0 5px 0 #000; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-8px) rotate(-3deg); } }
  .emptymsg h3 { margin:18px 0 8px; color:var(--g); font-size:24px; text-shadow:3px 3px 0 #000; }
  .emptymsg p { margin:0; color:var(--mut); }
  .emptymsg p b { color:var(--p); }
  .tile { position:absolute; background:#000; border:3px solid var(--g); border-radius:14px; overflow:hidden; box-shadow:0 5px 0 #000; transition:left .25s, top .25s, width .25s, height .25s, border-color .2s; }
  .tile.alt { border-color:var(--p); }
  .tile iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .tile .lbl { position:absolute; top:8px; left:8px; z-index:2; display:flex; align-items:center; gap:6px; background:rgba(11,9,18,.88); border:2px solid #000; border-radius:8px; padding:3px 8px; font-size:12px; font-weight:800; pointer-events:none; }
  .tile .ctl { position:absolute; top:6px; right:6px; z-index:2; display:flex; gap:4px; opacity:0; transition:opacity .15s; }
  .tile:hover .ctl, .tile.focus .ctl { opacity:1; }
  .tile .ctl button, .tile .ctl a { width:30px; height:30px; display:grid; place-items:center; border-radius:8px; border:2px solid #000; background:rgba(29,25,45,.95); color:var(--txt); text-decoration:none; font-size:13px; padding:0; box-shadow:0 2px 0 #000; }
  .tile .ctl button:hover, .tile .ctl a:hover { background:var(--g); color:#06210b; }
  .tile .ctl .x:hover { background:var(--p); color:#fff; }
  .tile.focus { border-color:#fff; box-shadow:0 5px 0 #000, 0 0 24px rgba(30,232,54,.35); }
  body.dragging .tile iframe { pointer-events:none; }

  /* chat */
  #chat { width:var(--chat); flex:none; display:flex; flex-direction:column; overflow:hidden; border-color:var(--p); box-shadow:var(--px-shadow), 0 0 30px rgba(247,57,146,.10); }
  #chat.hide { display:none; }
  .chathead { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:2px solid var(--line); font-size:13px; color:var(--p); text-shadow:2px 2px 0 #000; }
  .chathead button { background:none; border:0; color:var(--mut); font-size:15px; padding:0 4px; }
  .chathead button:hover { color:var(--p); }
  .tabs { display:flex; gap:6px; padding:8px 10px; overflow-x:auto; border-bottom:2px solid var(--line); flex:none; }
  .tabs button { flex:none; display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:8px; background:var(--panel2); border:2px solid var(--line); font-size:12px; font-weight:700; white-space:nowrap; }
  .tabs button.on { border-color:var(--p); background:rgba(247,57,146,.15); }
  .chatbody { flex:1; position:relative; min-height:0; }
  .chatbody iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; }
  .chatbody iframe.on { display:block; }
  .chatbody .msg { padding:20px; color:var(--mut); text-align:center; font-size:13px; }
  .chatbody .msg a { color:var(--g); }
  .chatfoot { padding:6px 10px; border-top:2px solid var(--line); font-size:11px; text-align:right; }
  .chatfoot a { color:var(--mut); }
  .chatfoot a:hover { color:var(--p); }

  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--g); color:#06210b; border:2px solid #000; box-shadow:0 4px 0 #000; padding:8px 14px; border-radius:10px; font-weight:800; z-index:50; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }

  /* ---------- responsivo ---------- */
  @media (max-width:1180px) { :root { --chat:300px; --side:270px; } h1 { font-size:24px; } }
  @media (max-width:860px) {
    body { overflow:auto; }
    header { grid-template-columns:1fr auto; height:auto; padding:10px var(--pad) 14px; }
    .logo img { height:42px; }
    h1 { display:none; }
    #app { flex-direction:column; height:auto; }
    #side, #side.collapsed { width:auto; padding:14px; }
    #side.collapsed > :not(.shead), #side.collapsed .shead > :not(#collapse) { display:none; }
    #side.collapsed .shead > h2 { display:block; }
    #list { max-height:340px; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
    #list .card .av { font-size:24px; }
    .hright { gap:6px; }
    .hright .btn { padding:6px 8px; }
    .count { display:none; }
    #scene { min-height:240px; }
    #chat { width:auto; height:480px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="./" title="Xupeimon"><img src="img/logo.webp" alt="Xupeimon"></a>
  <h1 class="px">MULTI-VIEW</h1>
  <div class="hright">
    <span class="count" id="count">0 POVs selecionados</span>
    <button class="btn" id="share" title="Copia um link com essa lista e essa cena">🔗 Compartilhar</button>
    <button class="btn pink" id="chatBtn" title="Mostrar/esconder chat">💬 Chat</button>
  </div>
</header>

<div id="app">
  <aside id="side" class="panel">
    <div class="shead">
      <h2 class="px">Montar a view</h2>
      <button class="ico on" id="vGrid" title="Cards">▦</button>
      <button class="ico" id="vList" title="Lista">☰</button>
      <button class="ico" id="collapse" title="Recolher">‹</button>
    </div>
    <label class="search"><span>🔍</span><input id="q" placeholder="Buscar POVs..." autocomplete="off"></label>
    <div class="checks">
      <label><input type="checkbox" id="onlyLive"> Só quem tá ao vivo</label>
    </div>
    <div class="row">
      <button class="btn" id="addBtn">＋ Adicionar streamer</button>
      <button class="btn" id="refresh" title="Atualizar status">↻ Atualizar</button>
    </div>
    <form id="addForm" autocomplete="off">
      <div class="plats">
        <button type="button" class="btn plat twitch on" data-p="twitch">Twitch</button>
        <button type="button" class="btn plat kick" data-p="kick">Kick</button>
        <button type="button" class="btn plat youtube" data-p="youtube" title="Cole o link ou o ID do canal (UC...)">YouTube</button>
      </div>
      <input id="chan" placeholder="canal ou link (ex: oflopi)">
      <div class="row2">
        <button type="submit" class="btn on">Adicionar</button>
        <button type="button" class="btn" id="reset" title="Volta pra lista do Xupeimon">Lista padrão</button>
      </div>
    </form>
    <div class="row2">
      <button class="btn" id="selLive">Selecionar ao vivo</button>
      <button class="btn" id="clear">Limpar</button>
    </div>
    <div id="list"></div>
  </aside>

  <main id="scene" class="empty"></main>

  <aside id="chat" class="panel">
    <div class="chathead"><span class="px">Chat</span><button id="chatClose" title="Fechar chat">✕</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="chatbody" id="chatbody"></div>
    <div class="chatfoot" id="chatfoot"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= estado ================= */
// A lista de POVs vem do bot do Discord (povs.json, gerado por "npm run site" no bot).
const KEY = 'xupeimon-multiview-v3';
const OLD_KEYS = ['xupeimon-multiview-v2', 'xupeimon-multilive-v1'];
const OLD_DEFAULTS = ['kick:oflopi', 'kick:o-mitsuke', 'twitch:ironicroseiro', 'twitch:bolhasuco', 'twitch:kojjlul'];
const AV_KEY = 'xupeimon-avatars';
const PLATS = ['twitch', 'kick', 'youtube'];
const PLABEL = { twitch: 'TW', kick: 'KICK', youtube: 'YT' };
const PNAME = { twitch: 'Twitch', kick: 'Kick', youtube: 'YouTube' };
const host = location.hostname || 'localhost';
const $ = s => document.querySelector(s);
const clean = c => String(c || '').trim().toLowerCase()
  .replace(/^https?:\/\/(www\.)?(twitch\.tv|kick\.com)\//, '').replace(/[\/?#].*$/, '').replace(/[^a-z0-9_-]/g, '');
const cleanYt = c => (String(c || '').match(/UC[\w-]{22}/) || [''])[0];
const cleanFor = (p, c) => p === 'youtube' ? cleanYt(c) : clean(c);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const key = (p, c) => p + ':' + c;

let BOT = [];            // POVs do bot
let POVS = [];           // BOT (menos os escondidos) + adicionados à mão
let st = loadState();
let status = {};         // "plat:canal" -> true | false | undefined (desconhecido)
let viewers = {};
let avatars = {};
try { avatars = JSON.parse(localStorage.getItem(AV_KEY)) || {}; } catch (e) {}
let firstCheck = !st.saved;
let kickApiOk = true;
let chatTab = null;
let addPlat = 'twitch';

function loadState() {
  const base = { selected: [], focus: null, view: 'grid', collapsed: false, chat: innerWidth > 1200, onlyLive: false, custom: [], hidden: [], plat: {}, saved: false };
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (s) return Object.assign(base, s, { saved: true });
  for (const k of OLD_KEYS) {
    try {
      const o = JSON.parse(localStorage.getItem(k));
      if (!o) continue;
      base.legacy = Array.isArray(o) ? { channels: o, selected: [] } : o;
      base.saved = !Array.isArray(o);
      break;
    } catch (e) {}
  }
  return base;
}
function save() {
  const { saved, legacy, ...rest } = st;
  try { localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) {}
}

// "twitch:fulano" -> id do POV do bot que tem esse canal, ou cria um POV avulso
function idForChannel(p, c) {
  c = cleanFor(p, c);
  if (!PLATS.includes(p) || !c) return null;
  const v = BOT.find(b => b[p] === c);
  if (v) { st.hidden = st.hidden.filter(h => h !== v.id); return v.id; }
  if (!st.custom.some(x => x.p === p && x.c === c)) st.custom.push({ p, c });
  return key(p, c);
}
const resolveToken = t => t.includes(':') ? idForChannel(...t.split(':')) : t;

function applyLegacyAndUrl() {
  if (st.legacy) {
    const l = st.legacy;
    for (const ch of l.channels || []) if (!OLD_DEFAULTS.includes(key(ch.p, ch.c))) idForChannel(ch.p, ch.c);
    // canais da lista padrão antiga que não estão no bot não viram POV avulso
    const known = t => !OLD_DEFAULTS.includes(t) || BOT.some(b => key('twitch', b.twitch) === t || key('kick', b.kick) === t);
    st.selected = (l.selected || []).filter(known).map(t => resolveToken(t)).filter(Boolean);
    if (l.focus && known(l.focus)) st.focus = resolveToken(l.focus);
    for (const k of ['view', 'collapsed', 'chat', 'onlyLive']) if (k in l) st[k] = l[k];
    delete st.legacy;
  }
  const qs = new URLSearchParams(location.search);
  if (qs.get('c') || qs.get('v')) {
    const cs = (qs.get('c') || '').split(',').filter(Boolean).map(resolveToken).filter(Boolean);
    const vs = qs.get('v') ? qs.get('v').split(',').filter(Boolean).map(resolveToken).filter(Boolean) : cs;
    st.selected = [...new Set(vs)];
    st.focus = null;
    st.saved = true;
    firstCheck = false;
  }
}

function buildPovs() {
  const hidden = new Set(st.hidden);
  const custom = st.custom.map(({ p, c }) => ({ id: key(p, c), name: c, [p]: c, custom: true }));
  POVS = [...BOT.filter(v => !hidden.has(v.id)), ...custom];
  const ids = new Set(POVS.map(v => v.id));
  st.selected = [...new Set(st.selected)].filter(k => ids.has(k));
  if (!ids.has(st.focus)) st.focus = null;
}
const povOf = id => POVS.find(v => v.id === id);
const isSel = id => st.selected.includes(id);
const plats = v => PLATS.filter(p => v[p]);

function povStatus(v) {
  let unknown = false;
  for (const p of plats(v)) {
    const s = status[key(p, v[p])];
    if (s === true) return true;
    if (s === undefined) unknown = true;
  }
  return unknown ? undefined : false;
}
function povViewers(v) {
  return plats(v).reduce((n, p) => n + (status[key(p, v[p])] === true ? (viewers[key(p, v[p])] || 0) : 0), 0);
}
// plataforma usada no player: a escolhida na mão, senão a que está ao vivo
function activePlat(v) {
  const o = st.plat[v.id];
  if (o && v[o]) return o;
  const ps = plats(v);
  return ps.find(p => status[key(p, v[p])] === true) || ps.find(p => status[key(p, v[p])] !== false) || ps[0];
}

/* ================= urls ================= */
const ytVideo = {};   // canal do YouTube (UC...) -> ID da live, vindo do bot
function playerSrc(p, c) {
  if (p === 'twitch') return `https://player.twitch.tv/?channel=${encodeURIComponent(c)}&parent=${encodeURIComponent(host)}&muted=true&autoplay=true`;
  if (p === 'kick') return `https://player.kick.com/${encodeURIComponent(c)}?muted=true&autoplay=true`;
  if (ytVideo[c]) return `https://www.youtube.com/embed/${ytVideo[c]}?autoplay=1&mute=1`;
  return `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(c)}&autoplay=1&mute=1`;
}
function chatSrc(p, c) {
  if (p === 'twitch') return `https://www.twitch.tv/embed/${encodeURIComponent(c)}/chat?parent=${encodeURIComponent(host)}&darkpopout`;
  if (p === 'kick') return `https://kick.com/popout/${encodeURIComponent(c)}/chat`;
  if (ytVideo[c]) return `https://www.youtube.com/live_chat?v=${ytVideo[c]}&embed_domain=${encodeURIComponent(host)}`;
  return null; // o YouTube só deixa embutir o chat sabendo o ID da live
}
function pageUrl(p, c) {
  if (p === 'twitch') return `https://twitch.tv/${c}`;
  if (p === 'kick') return `https://kick.com/${c}`;
  return `https://www.youtube.com/channel/${c}/live`;
}
function popoutChat(p, c) {
  if (p === 'twitch') return `https://www.twitch.tv/popout/${c}/chat?popout=`;
  if (p === 'kick') return `https://kick.com/popout/${c}/chat`;
  return `https://www.youtube.com/channel/${c}/live`;
}
const tagHtml = p => `<span class="tag ${p}">${PLABEL[p]}</span>`;

/* ================= sidebar ================= */
function statusText(v) {
  const s = povStatus(v);
  if (s === true) { const n = povViewers(v); return `<span class="dot live"></span>${n ? n.toLocaleString('pt-BR') + ' ao vivo' : 'Ao vivo'}`; }
  if (s === false) return `<span class="dot"></span>Offline`;
  const ps = plats(v);
  const unk = ps.filter(p => status[key(p, v[p])] === undefined);
  return `<span class="dot"></span>${checking || unk.some(p => p !== 'youtube') ? '...' : 'YouTube ?'}`;
}
function bgOf(id) { let h = 7; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 4; }
function faceStyle(v) {
  const u = esc(v.skin + (v.skinV ? '?v=' + v.skinV : ''));
  return `background:url('${u}') 71.43% 14.29% / 800% auto, url('${u}') 14.29% 14.29% / 800% auto`;
}
function avatarHtml(v) {
  if (v.skin || (v.pokemon && v.pokemon.length)) {
    const url = cardUrls.get(v.id);
    return `<div class="av skin bg${bgOf(v.id)}${url ? ' done' : ''}" data-card="${esc(v.id)}">${v.skin ? `<div class="face" style="${faceStyle(v)}"></div>` : ''}<img alt=""${url ? ` src="${url}"` : ''}></div>`;
  }
  const a = plats(v).map(p => avatars[key(p, v[p])]).find(Boolean);
  if (a) return `<div class="av" style="background-image:url('${esc(a)}')"></div>`;
  return `<div class="av">${esc((v.name || '?')[0].toUpperCase())}</div>`;
}

/* cards 3D (skin em pose + Pokémon do Cobblemon), desenhados uma vez e guardados */
const cardUrls = new Map();
const cards3d = import('./cards3d.js').catch(e => { console.warn('cards 3D indisponíveis', e); return null; });
function requestCards(items) {
  cards3d.then(mod => {
    if (!mod) return;
    for (const v of items) {
      if (cardUrls.has(v.id) || !(v.skin || (v.pokemon && v.pokemon.length))) continue;
      cardUrls.set(v.id, null);
      mod.cardImage(v).then(url => {
        cardUrls.set(v.id, url);
        document.querySelectorAll(`[data-card="${CSS.escape(v.id)}"]`).forEach(av => { av.querySelector('img').src = url; av.classList.add('done'); });
      }).catch(e => console.warn('card', v.id, e));
    }
  });
}

function renderList() {
  const box = $('#list');
  const q = $('#q').value.trim().toLowerCase();
  box.className = st.view === 'list' ? 'lines' : '';
  const items = POVS.filter(v => (!st.onlyLive || povStatus(v) !== false) &&
    (!q || [v.name, v.mc, v.twitch, v.kick].some(x => x && String(x).toLowerCase().includes(q))));
  items.sort((a, b) =>
    (povStatus(b) === true) - (povStatus(a) === true) ||
    povViewers(b) - povViewers(a) ||
    !!b.top - !!a.top ||
    a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = `<div class="none">${POVS.length ? 'Nenhum POV encontrado.' : 'Carregando POVs...'}</div>`; return; }
  const nLive = items.filter(v => povStatus(v) === true).length;
  let grupo = null;
  for (const v of items) {
    const ps = povStatus(v);
    const g = ps === true ? 'live' : 'rest';
    if (g !== grupo) {
      grupo = g;
      const sep = document.createElement('div');
      sep.className = 'sep ' + g;
      sep.innerHTML = g === 'live'
        ? `<span class="px">● Ao vivo</span><b>${nLive}</b>`
        : `<span class="px">${nLive ? 'Offline' : 'Ninguém ao vivo agora'}</span>`;
      box.appendChild(sep);
    }
    const el = document.createElement('div');
    el.className = 'card' + (isSel(v.id) ? ' sel' : '') + (ps === true ? ' live' : ps === false ? ' off' : '');
    el.title = (isSel(v.id) ? 'Tirar da cena' : 'Colocar na cena') + (v.mc ? ` · Minecraft: ${v.mc}` : '');
    el.innerHTML = `
      ${avatarHtml(v)}
      <div class="info"><div class="nm">${esc(v.name)}</div><div class="st">${statusText(v)}</div></div>
      <span class="tg">${plats(v).map(tagHtml).join('')}</span>
      <span class="tick">${isSel(v.id) ? '✓' : ''}</span>
      ${ps === true ? `<span class="onair px">● Ao vivo${povViewers(v) ? ' · ' + povViewers(v).toLocaleString('pt-BR') : ''}</span>` : ''}
      <button class="rm" title="${v.custom ? 'Remover da lista' : 'Esconder da lista'}">✕</button>`;
    el.onclick = () => toggleSel(v.id);
    el.querySelector('.rm').onclick = e => { e.stopPropagation(); removePov(v); };
    box.appendChild(el);
  }
  requestCards(items);
}

function toggleSel(id) {
  if (isSel(id)) { st.selected = st.selected.filter(x => x !== id); if (st.focus === id) st.focus = null; }
  else st.selected.push(id);
  save(); renderAll();
}
function removePov(v) {
  if (v.custom) st.custom = st.custom.filter(x => key(x.p, x.c) !== v.id);
  else st.hidden.push(v.id);
  buildPovs(); save(); renderAll();
  toast(v.custom ? `${v.name} removido` : `${v.name} escondido (Lista padrão traz de volta)`);
}

/* ================= cena ================= */
// iframes nunca são re-anexados (isso recarregaria a live); só reposicionamos.
const tiles = new Map();
function ensureTile(v) {
  let el = tiles.get(v.id);
  const p = activePlat(v), c = v[p];
  if (el) {
    const src = playerSrc(p, c);
    if (el.dataset.plat !== p || el.dataset.src !== src) {     // trocou de plataforma ou a live do YouTube começou
      el.dataset.plat = p;
      el.dataset.src = src;
      el.querySelector('iframe').src = src;
      el.querySelector('.lt').outerHTML = `<span class="lt">${tagHtml(p)}</span>`;
      el.querySelector('.ab').href = pageUrl(p, c);
      updatePb(el, v, p);
    }
    return el;
  }
  el = document.createElement('div');
  el.className = 'tile' + (bgOf(v.id) % 2 ? ' alt' : '');
  el.dataset.plat = p;
  el.dataset.src = playerSrc(p, c);
  el.innerHTML = `
    <div class="lbl"><span class="dot"></span><span class="lt">${tagHtml(p)}</span><span>${esc(v.name)}</span></div>
    <div class="ctl">
      <button class="pb" title="Trocar de plataforma"></button>
      <button class="fb" title="Destacar">⤢</button>
      <button class="cb" title="Ver chat">💬</button>
      <a class="ab" href="${pageUrl(p, c)}" target="_blank" rel="noopener" title="Abrir no site">↗</a>
      <button class="x" title="Tirar da cena">✕</button>
    </div>
    <iframe src="${playerSrc(p, c)}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  updatePb(el, v, p);
  el.querySelector('.pb').onclick = () => {
    const ps = plats(v), cur = el.dataset.plat;
    st.plat[v.id] = ps[(ps.indexOf(cur) + 1) % ps.length];
    save(); renderAll();
  };
  el.querySelector('.fb').onclick = () => { st.focus = st.focus === v.id ? null : v.id; save(); layout(); };
  el.querySelector('.cb').onclick = () => { chatTab = v.id; st.chat = true; save(); renderChat(); layout(); };
  el.querySelector('.x').onclick = () => toggleSel(v.id);
  $('#scene').appendChild(el);
  tiles.set(v.id, el);
  return el;
}
function updatePb(el, v, p) {
  const ps = plats(v), b = el.querySelector('.pb');
  b.style.display = ps.length > 1 ? '' : 'none';
  if (ps.length > 1) { const nx = ps[(ps.indexOf(p) + 1) % ps.length]; b.textContent = '⇄ ' + PLABEL[nx]; b.title = 'Trocar para ' + PNAME[nx]; }
}

// melhor grade (cols x rows) de tiles 16:9 dentro de w x h
function bestGrid(n, w, h, g) {
  let best = { cols: 1, rows: 1, tw: 0, th: 0 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    let tw = (w - (cols - 1) * g) / cols;
    let th = tw * 9 / 16;
    if (th * rows + (rows - 1) * g > h) { th = (h - (rows - 1) * g) / rows; tw = th * 16 / 9; }
    if (tw > best.tw) best = { cols, rows, tw, th };
  }
  return best;
}
function place(ids, x, y, w, h, g, out) {
  const n = ids.length;
  if (!n) return;
  const b = bestGrid(n, w, h, g);
  const totalH = b.rows * b.th + (b.rows - 1) * g;
  const oy = y + (h - totalH) / 2;
  ids.forEach((k, i) => {
    const r = Math.floor(i / b.cols), c = i % b.cols;
    const inRow = Math.min(b.cols, n - r * b.cols);
    const rowW = inRow * b.tw + (inRow - 1) * g;
    const ox = x + (w - rowW) / 2;
    out[k] = { x: ox + c * (b.tw + g), y: oy + r * (b.th + g), w: b.tw, h: b.th };
  });
}

function layout() {
  const scene = $('#scene');
  const ids = st.selected.filter(povOf);
  const keep = new Set(ids);
  for (const [k, el] of tiles) if (!keep.has(k)) { el.remove(); tiles.delete(k); }

  scene.classList.toggle('empty', !ids.length);
  let msg = scene.querySelector('.emptymsg');
  if (!ids.length) {
    if (!msg) { msg = document.createElement('div'); msg.className = 'emptymsg'; msg.innerHTML = '<img src="img/favicon.png" alt=""><h3 class="px">Sua cena tá vazia</h3><p>Escolha <b>POVs</b> na esquerda pra assistir todo mundo ao mesmo tempo.</p>'; scene.appendChild(msg); }
    scene.style.height = '';
    return;
  }
  if (msg) msg.remove();
  ids.forEach(id => ensureTile(povOf(id)));

  const g = 10;
  const mobile = innerWidth <= 860;
  const W = scene.clientWidth;
  const pos = {};
  if (mobile) {
    const th = W * 9 / 16;
    const order = st.focus && keep.has(st.focus) ? [st.focus, ...ids.filter(k => k !== st.focus)] : ids;
    order.forEach((k, i) => pos[k] = { x: 0, y: i * (th + g), w: W, h: th });
    scene.style.height = (order.length * (th + g) - g) + 'px';
  } else {
    scene.style.height = '';
    const H = scene.clientHeight;
    const f = st.focus && keep.has(st.focus) && ids.length > 1 ? st.focus : null;
    if (!f) place(ids, 0, 0, W, H, g, pos);
    else {
      const rest = ids.filter(k => k !== f);
      const side = Math.max(160, W * 0.22);
      const bottom = Math.max(110, H * 0.24);
      if (bestGrid(1, W - side - g, H, g).tw >= bestGrid(1, W, H - bottom - g, g).tw) {
        place([f], 0, 0, W - side - g, H, g, pos);
        place(rest, W - side, 0, side, H, g, pos);
      } else {
        place([f], 0, 0, W, H - bottom - g, g, pos);
        place(rest, 0, H - bottom, W, bottom, g, pos);
      }
    }
  }
  for (const k of ids) {
    const el = tiles.get(k), p = pos[k], v = povOf(k);
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.width = p.w + 'px'; el.style.height = p.h + 'px';
    el.classList.toggle('focus', st.focus === k && ids.length > 1);
    const aoVivo = status[key(el.dataset.plat, v[el.dataset.plat])] === true;
    el.querySelector('.dot').classList.toggle('live', aoVivo);
    el.classList.toggle('is-live', aoVivo);
    el.querySelector('.fb').textContent = st.focus === k ? '⤡' : '⤢';
  }
}

/* ================= chat ================= */
const chatFrames = new Map();   // "id|plat" -> iframe
function renderChat() {
  $('#chat').classList.toggle('hide', !st.chat);
  $('#chatBtn').classList.toggle('on', st.chat);
  const ids = st.selected.filter(povOf);
  if (!ids.includes(chatTab)) chatTab = ids.includes(st.focus) ? st.focus : ids[0] || null;

  const tabs = $('#tabs');
  tabs.innerHTML = '';
  ids.forEach(id => {
    const v = povOf(id);
    const b = document.createElement('button');
    b.className = id === chatTab ? 'on' : '';
    b.innerHTML = `<span class="dot ${povStatus(v) === true ? 'live' : ''}"></span>${esc(v.name)}`;
    b.onclick = () => { chatTab = id; renderChat(); };
    tabs.appendChild(b);
  });
  tabs.style.display = ids.length ? '' : 'none';

  const body = $('#chatbody');
  const want = chatTab ? (() => { const vv = povOf(chatTab), pp = activePlat(vv); return chatTab + '|' + pp + '|' + (pp === 'youtube' ? (ytVideo[vv.youtube] || '') : ''); })() : null;
  for (const [k, fr] of chatFrames) if (!ids.includes(k.split('|')[0])) { fr.remove(); chatFrames.delete(k); }
  let msg = body.querySelector('.msg');
  const showMsg = html => {
    if (!msg) { msg = document.createElement('div'); msg.className = 'msg'; body.appendChild(msg); }
    msg.innerHTML = html;
  };
  if (!chatTab) {
    showMsg('Coloque alguém na cena pra ver o chat.');
    for (const fr of chatFrames.values()) fr.classList.remove('on');
    $('#chatfoot').innerHTML = '';
    return;
  }
  const v = povOf(chatTab), p = activePlat(v), c = v[p];
  const src = chatSrc(p, c);
  if (!src) {
    showMsg(`O YouTube não deixa colocar o chat aqui.<br><a href="${popoutChat(p, c)}" target="_blank" rel="noopener">Abrir a live de ${esc(v.name)} no YouTube ↗</a>`);
  } else {
    if (msg) { msg.remove(); msg = null; }
    if (st.chat && !chatFrames.has(want)) {
      const fr = document.createElement('iframe');
      fr.referrerPolicy = 'strict-origin-when-cross-origin';
      fr.src = src;
      body.appendChild(fr);
      chatFrames.set(want, fr);
    }
  }
  for (const [k, fr] of chatFrames) fr.classList.toggle('on', k === want && !!src);
  $('#chatfoot').innerHTML = `<a href="${popoutChat(p, c)}" target="_blank" rel="noopener">abrir chat de ${esc(v.name)} em outra janela ↗</a>`;
}

/* ================= status ================= */
async function txt(u) { const r = await fetch(u); return (await r.text()).trim(); }
function saveAvatar(k, url) {
  if (!url || avatars[k]) return;
  avatars[k] = url;
  try { localStorage.setItem(AV_KEY, JSON.stringify(avatars)); } catch (e) {}
}
async function checkTwitch(c, needAvatar) {
  const k = key('twitch', c);
  try {
    const t = (await txt(`https://decapi.me/twitch/uptime/${encodeURIComponent(c)}`)).toLowerCase();
    status[k] = !(t.includes('offline') || t.includes('not found') || t.includes('error') || t.includes('rate limit'));
    if (status[k]) {
      const n = parseInt(await txt(`https://decapi.me/twitch/viewercount/${encodeURIComponent(c)}`), 10);
      viewers[k] = isNaN(n) ? null : n;
    } else viewers[k] = null;
  } catch (e) { status[k] = undefined; }
  if (needAvatar && !avatars[k]) {
    try { const a = await txt(`https://decapi.me/twitch/avatar/${encodeURIComponent(c)}`); if (/^https:\/\//.test(a)) saveAvatar(k, a); } catch (e) {}
  }
}
async function checkKick(c) {
  if (!kickApiOk) return;
  const k = key('kick', c);
  try {
    const r = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(c)}`);
    if (!r.ok) throw 0;
    const j = await r.json();
    status[k] = !!j.livestream;
    viewers[k] = j.livestream ? j.livestream.viewer_count : null;
    saveAvatar(k, j.user && j.user.profile_pic);
  } catch (e) { kickApiOk = false; }   // a Kick às vezes bloqueia o navegador; aí o status fica "..."
}
// roda as checagens de poucas em poucas pra não levar bloqueio
async function pool(jobs, n) {
  const q = jobs.slice();
  await Promise.all(Array.from({ length: n }, async () => { while (q.length) await q.shift()(); }));
}
let botLive = null;
async function checkBotLive() {
  try {
    let j;
    try {
      const r = await fetch('https://api.github.com/repos/xupingoli/xupingoli.github.io/contents/multistream/live.json', { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
      if (!r.ok) throw 0;
      j = await r.json();
    } catch { j = await (await fetch('live.json?t=' + Date.now())).json(); }
    // o bot confirma a cada 6h; mais velho que isso = bot desligado, não dá pra confiar
    botLive = Date.now() - Date.parse(j.updated) < 7 * 3600 * 1000 ? (j.lives || {}) : null;
  } catch { botLive = null; }
}
function applyBotLive() {
  if (!botLive) return;
  for (const v of POVS) {
    if (v.custom) continue;
    const ent = botLive[v.id] || [];
    if (v.youtube) {
      const e = ent.find(x => x.p === 'youtube');
      status[key('youtube', v.youtube)] = !!e;
      if (e && e.video) ytVideo[v.youtube] = e.video; else delete ytVideo[v.youtube];
    }
    // Twitch/Kick: se o navegador não conseguiu checar, usa o que o bot viu
    for (const p of ['twitch', 'kick']) {
      if (v[p] && status[key(p, v[p])] === undefined) status[key(p, v[p])] = ent.some(x => x.p === p);
    }
  }
}
let checking = false;
async function checkStatus() {
  if (checking || !POVS.length) return;
  checking = true;
  $('#refresh').textContent = '↻ ...';
  const jobs = [];
  const seen = new Set();
  for (const v of POVS) {
    for (const p of plats(v)) {
      const k = key(p, v[p]);
      if (seen.has(k)) continue;
      seen.add(k);
      if (p === 'twitch') jobs.push(() => checkTwitch(v.twitch, !v.skin));
      if (p === 'kick') jobs.push(() => checkKick(v.kick));
    }
  }
  await Promise.all([pool(jobs, 6), checkBotLive()]);
  applyBotLive();
  checking = false;
  $('#refresh').textContent = '↻ Atualizar';
  if (firstCheck) {
    // primeira visita: a cena já começa com quem tá ao vivo
    firstCheck = false;
    st.selected = POVS.filter(v => povStatus(v) === true).map(v => v.id);
    save();
  }
  renderAll();
}

/* ================= geral ================= */
function renderAll() {
  const n = st.selected.length;
  $('#count').textContent = `${n} POV${n === 1 ? '' : 's'} selecionado${n === 1 ? '' : 's'}`;
  $('#side').classList.toggle('collapsed', st.collapsed);
  $('#collapse').textContent = st.collapsed ? '›' : '‹';
  $('#vGrid').classList.toggle('on', st.view === 'grid');
  $('#vList').classList.toggle('on', st.view === 'list');
  $('#onlyLive').checked = st.onlyLive;
  renderList();
  renderChat();
  layout();
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

$('#q').oninput = renderList;
$('#onlyLive').onchange = e => { st.onlyLive = e.target.checked; save(); renderList(); };
$('#vGrid').onclick = () => { st.view = 'grid'; save(); renderAll(); };
$('#vList').onclick = () => { st.view = 'list'; save(); renderAll(); };
$('#collapse').onclick = () => { st.collapsed = !st.collapsed; save(); renderAll(); setTimeout(layout, 220); };
$('#refresh').onclick = checkStatus;
$('#addBtn').onclick = () => { $('#addForm').classList.toggle('open'); if ($('#addForm').classList.contains('open')) $('#chan').focus(); };
document.querySelectorAll('.plat').forEach(b => b.onclick = () => {
  addPlat = b.dataset.p;
  document.querySelectorAll('.plat').forEach(x => x.classList.toggle('on', x === b));
});
$('#chan').oninput = e => {   // colou um link? já escolhe a plataforma
  const v = e.target.value;
  const p = /kick\.com/i.test(v) ? 'kick' : /twitch\.tv/i.test(v) ? 'twitch' : /youtube\.com|UC[\w-]{22}/.test(v) ? 'youtube' : null;
  if (p) document.querySelector(`.plat[data-p="${p}"]`).click();
};
$('#addForm').onsubmit = e => {
  e.preventDefault();
  const raw = $('#chan').value;
  const c = cleanFor(addPlat, raw);
  if (!c) { if (addPlat === 'youtube') toast('Cole o link do canal com o ID (começa com UC...)'); return; }
  const id = idForChannel(addPlat, c);
  buildPovs();
  if (!isSel(id)) st.selected.push(id);
  $('#chan').value = '';
  save(); renderAll(); checkStatus();
  toast(`${povOf(id).name} na cena ✓`);
};
$('#reset').onclick = () => {
  if (!confirm('Voltar pra lista do Xupeimon? Os canais que você adicionou somem e os escondidos voltam.')) return;
  st.custom = []; st.hidden = []; st.plat = {};
  buildPovs(); save(); renderAll(); checkStatus();
};
$('#selLive').onclick = () => {
  const live = POVS.filter(v => povStatus(v) === true).map(v => v.id);
  if (!live.length) { toast('Ninguém ao vivo agora'); return; }
  st.selected = [...st.selected, ...live.filter(id => !isSel(id))];
  save(); renderAll();
};
$('#clear').onclick = () => { st.selected = []; st.focus = null; save(); renderAll(); };
$('#chatBtn').onclick = () => { st.chat = !st.chat; save(); renderChat(); layout(); };
$('#chatClose').onclick = () => { st.chat = false; save(); renderChat(); layout(); };
$('#share').onclick = async () => {
  const sel = st.selected.filter(povOf);
  const custom = sel.filter(id => povOf(id).custom);
  let link = location.origin + location.pathname + '?v=' + sel.join(',');
  if (custom.length) link += '&c=' + custom.join(',');
  try { await navigator.clipboard.writeText(link); toast('Link copiado ✓'); }
  catch (e) { prompt('Copie o link:', link); }
};
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
new ResizeObserver(() => layout()).observe($('#scene'));

(async function init() {
  renderAll();
  try {
    const r = await fetch('povs.json', { cache: 'no-cache' });
    const j = await r.json();
    BOT = (j.povs || []).map(v => ({ ...v, id: String(v.mc || v.name).toLowerCase().replace(/[^a-z0-9_-]/g, '') }));
  } catch (e) { toast('Não consegui carregar a lista de POVs'); }
  applyLegacyAndUrl();
  buildPovs();
  save();
  renderAll();
  checkStatus();
  setInterval(checkStatus, 120000);
})();
</script>
